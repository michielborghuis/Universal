name: Bouw Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Project ophalen
        uses: actions/checkout@v4

      - name: Flutter installeren
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch stable "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Android-projectbestanden aanmaken
        run: |
          flutter config --no-analytics
          flutter create --platforms=android --org nl.michielborghuis --project-name universele_counter .

      - name: Appnaam instellen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = text.replace('android:label="universele_counter"', 'android:label="Counter"')
          manifest.write_text(text)
          PY

      - name: Launcher-iconen maken
        run: |
          python3 -m pip install pillow
          python3 - <<'PYICON'
          from pathlib import Path
          from PIL import Image
          source = Image.open("assets/icon/logo.png").convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              destination = Path("android/app/src/main/res") / folder
              destination.mkdir(parents=True, exist_ok=True)
              source.resize((size, size), Image.Resampling.LANCZOS).save(
                  destination / "ic_launcher.png"
              )
          PYICON

      - name: Packages installeren
        run: flutter pub get

      - name: APK bouwen
        run: flutter build apk --release

      - name: APK beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: Counter-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
